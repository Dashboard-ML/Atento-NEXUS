<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS | Tu espacio digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="is-intro">
  <div class="space-bg" aria-hidden="true">
    <div class="star-layer star-layer-far"></div>
    <div class="star-layer star-layer-mid"></div>
    <div class="star-layer star-layer-near"></div>
    <div class="nebula nebula-a"></div>
    <div class="nebula nebula-b"></div>
    <div class="nebula nebula-c"></div>
    <div class="warp-burst"></div>
  </div>

  <section class="intro-sequence" id="introSequence" aria-label="Pantalla de introducción">
    <div class="intro-title-wrap">
      <p class="intro-kicker">Universo de aplicaciones</p>
      <h1 class="intro-title">NEXUS</h1>
      <p class="intro-subtitle">Tu espacio digital</p>
    </div>
  </section>

  <div class="app-shell">
    <div class="safe-frame">
      <main class="viewport" id="viewport">
        <section class="scene" id="scene" aria-label="Mapa de aplicaciones">
          <div class="scene-center-glow"></div>
          <div class="main-orbit orbit-inner"></div>
          <div class="main-orbit orbit-middle"></div>
          <div class="main-orbit orbit-outer"></div>

          <header class="brand-lockup">
            <p class="eyebrow">Universo de aplicaciones</p>
            <h1>NEXUS</h1>
            <div class="logo-wrap">
              <img src="assets/logo-empresa.png" alt="Logo de la empresa" class="company-logo" />
            </div>
          </header>

          <article class="system system-top-left theme-dashboard" data-id="dashboard" tabindex="0">
            <button class="system-button" type="button" aria-label="Abrir Dashboard">
              <span class="system-visual accent-blue">
                <span class="ring ring-one"></span>
                <span class="ring ring-two"></span>
                <span class="satellite satellite-one"></span>
                <span class="satellite satellite-two"></span>
                <span class="core"></span>
                <span class="mini mini-one"></span>
                <span class="mini mini-two"></span>
              </span>
              <span class="system-copy">
                <strong>Dashboard Microlearning</strong>
                <small>Panel de microlearning</small>
              </span>
            </button>
          </article>

          <article class="system system-top-right theme-microlearning" data-id="microlearning" tabindex="0">
            <button class="system-button" type="button" aria-label="Abrir Microlearning">
              <span class="system-visual accent-orange">
                <span class="ring ring-one"></span>
                <span class="ring ring-two"></span>
                <span class="satellite satellite-one"></span>
                <span class="satellite satellite-two"></span>
                <span class="core"></span>
                <span class="mini mini-one"></span>
                <span class="mini mini-two"></span>
              </span>
              <span class="system-copy">
                <strong>Microlearning Builder</strong>
                <small>Constructor de cursos</small>
              </span>
            </button>
          </article>

          <article class="system system-left theme-roomsync" data-id="roomsync" tabindex="0">
            <button class="system-button" type="button" aria-label="Abrir RoomSync">
              <span class="system-visual accent-green">
                <span class="ring ring-one"></span>
                <span class="ring ring-two"></span>
                <span class="satellite satellite-one"></span>
                <span class="satellite satellite-two"></span>
                <span class="core"></span>
                <span class="mini mini-one"></span>
                <span class="mini mini-two"></span>
              </span>
              <span class="system-copy">
                <strong>Roomsync</strong>
                <small>Reservación de salas</small>
              </span>
            </button>
          </article>

          <article class="system system-right theme-cursos" data-id="cursos" tabindex="0">
            <button class="system-button" type="button" aria-label="Abrir Cursos">
              <span class="system-visual accent-violet">
                <span class="ring ring-one"></span>
                <span class="ring ring-two"></span>
                <span class="satellite satellite-one"></span>
                <span class="satellite satellite-two"></span>
                <span class="core"></span>
                <span class="mini mini-one"></span>
                <span class="mini mini-two"></span>
              </span>
              <span class="system-copy">
                <strong>Dashboard Desarrollo</strong>
                <small>Panel de desarrollo</small>
              </span>
            </button>
          </article>

          <article class="system system-bottom-left theme-reportes" data-id="reportes" tabindex="0">
            <button class="system-button" type="button" aria-label="Abrir Reportes">
              <span class="system-visual accent-cyan">
                <span class="ring ring-one"></span>
                <span class="ring ring-two"></span>
                <span class="satellite satellite-one"></span>
                <span class="satellite satellite-two"></span>
                <span class="core"></span>
                <span class="mini mini-one"></span>
                <span class="mini mini-two"></span>
              </span>
              <span class="system-copy">
                <strong>Atento Reels</strong>
                <small>Plataforma de reels</small>
              </span>
            </button>
          </article>

          <article class="system system-bottom-right theme-simuladores" data-id="simuladores" tabindex="0">
            <button class="system-button" type="button" aria-label="Abrir Simuladores">
              <span class="system-visual accent-teal">
                <span class="ring ring-one"></span>
                <span class="ring ring-two"></span>
                <span class="satellite satellite-one"></span>
                <span class="satellite satellite-two"></span>
                <span class="core"></span>
                <span class="mini mini-one"></span>
                <span class="mini mini-two"></span>
              </span>
              <span class="system-copy">
                <strong>Atento Space</strong>
                <small>Espacio digital</small>
              </span>
            </button>
          </article>
        </section>
      </main>

      <section class="preview-overlay" id="previewOverlay" aria-live="polite">
        <div class="preview-stage">
          <div class="preview-copy">
            <p class="preview-tag" id="previewTag">Categoría</p>
            <h3 id="previewTitle">Dashboard Microlearning</h3>
            <p id="previewDescription">Monitorea tu proceso y haz follow up de tus Microlearnings en tiempo real.</p>
          </div>

          <div class="preview-meta">
            <span class="meta-chip" id="previewStatus">Activo</span>
            <span class="meta-chip" id="previewUsers">124 usuarios</span>
            <span class="meta-chip" id="previewUpdate">Actualizado hoy</span>
          </div>

          <div class="hologram-card">
            <div class="hologram-window" id="previewWindow">
              <div class="window-topbar">
                <span></span><span></span><span></span>
                <strong id="previewWindowTitle">Dashboard Microlearning</strong>
              </div>

              <div class="window-grid">
                <aside class="holo-sidebar">
                  <div class="sidebar-pill"></div>
                  <div class="sidebar-pill"></div>
                  <div class="sidebar-pill"></div>
                  <div class="sidebar-pill"></div>
                </aside>

                <section class="holo-main">
                  <div class="app-thumbnail">
                    <video id="previewVideo" class="preview-media is-hidden" muted loop autoplay playsinline preload="metadata"></video>
                    <img id="previewImage" class="preview-media" src="assets/dashboard_microlearning.jpg" alt="Vista previa de Dashboard Microlearning" />
                  </div>
                  <div class="module-row module-kpi">
                    <div class="module-box"></div>
                    <div class="module-box"></div>
                    <div class="module-box"></div>
                  </div>

                  <div class="module-wide"></div>

                  
                </section>
              </div>
            </div>

            <div class="preview-actions">
              <button class="preview-back" id="previewBack" type="button">← Volver al universo</button>
              <a class="primary-action" id="previewLink" href="#" target="_blank" rel="noopener noreferrer">Abrir aplicación</a>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
